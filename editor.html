<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Interactive Code Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; height: 100vh; overflow: hidden; }
        .editor-container { height: 100vh; display: flex; flex-direction: column; }
        .editor-header { background: #2d3748; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .editor-title h1 { margin: 0; font-size: 1.5rem; }
        .editor-controls { display: flex; gap: 10px; }
        .btn { background: #48bb78; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn:hover { opacity: 0.9; }
        .split-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 80px); padding: 20px; }
        .editor-pane, .preview-pane { background: white; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .pane-header { background: #4a5568; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .pane-header h3 { margin: 0; }
        .editor-tabs { display: flex; gap: 5px; }
        .tab { background: #4a5568; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .tab.active { background: #667eea; }
        .editor-content { flex: 1; position: relative; }
        .editor-wrapper { height: 100%; display: none; }
        .editor-wrapper.active { display: flex; }
        .code-editor { width: 100%; height: 100%; border: none; font-family: 'Courier New', monospace; font-size: 14px; padding: 15px; resize: none; outline: none; }
        .preview-content { flex: 1; display: flex; flex-direction: column; }
        .preview-frame { flex: 1; border: none; background: white; width: 100%; height: 100%; }
        .console-section { height: 150px; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .console-header { background: #f7fafc; padding: 10px 15px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .console-btn { padding: 5px 10px; font-size: 0.8rem; background: #e2e8f0; color: #4a5568; border: none; border-radius: 4px; cursor: pointer; }
        .error-console { flex: 1; background: #1a202c; color: #e2e8f0; padding: 10px; font-family: 'Courier New', monospace; font-size: 0.9rem; overflow-y: auto; }
        .timestamp { color: #a0aec0; font-size: 0.8rem; }
        .refresh-btn { background: #667eea; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="editor-container">
        <header class="editor-header">
            <div class="editor-title">
                <h1>CodeQuest Code Editor</h1>
            </div>
            <div class="editor-controls">
                <button id="run-code" class="btn">▶ Run Code</button>
                <button id="save-code" class="btn" style="background: #667eea;">💾 Save</button>
                <button id="reset-code" class="btn" style="background: #e53e3e;">🔄 Reset</button>
                <a href="index.html" class="btn" style="background: #4a5568;">← Dashboard</a>
            </div>
        </header>

        <div class="split-container">
            <div class="editor-pane">
                <div class="pane-header">
                    <h3>Code Editor</h3>
                    <div class="editor-tabs">
                        <button class="tab active" data-lang="html">HTML</button>
                        <button class="tab" data-lang="css">CSS</button>
                        <button class="tab" data-lang="js">JavaScript</button>
                    </div>
                </div>
                <div class="editor-content">
                    <div class="editor-wrapper active" data-lang="html">
                        <textarea id="html-editor" class="code-editor" spellcheck="false" placeholder="Write your HTML code here..."></textarea>
                    </div>
                    <div class="editor-wrapper" data-lang="css">
                        <textarea id="css-editor" class="code-editor" spellcheck="false" placeholder="Write your CSS code here..."></textarea>
                    </div>
                    <div class="editor-wrapper" data-lang="js">
                        <textarea id="js-editor" class="code-editor" spellcheck="false" placeholder="Write your JavaScript code here..."></textarea>
                    </div>
                </div>
            </div>

            <div class="preview-pane">
                <div class="pane-header">
                    <h3>Live Preview</h3>
                    <button id="refresh-preview" class="refresh-btn">🔄 Refresh</button>
                </div>
                <div class="preview-content">
                    <iframe id="preview-frame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
                    <div class="console-section">
                        <div class="console-header">
                            <span>Console</span>
                            <button id="clear-console" class="console-btn">Clear</button>
                        </div>
                        <div id="error-console" class="error-console">
                            <div class="console-message info">
                                <span class="timestamp">[Ready]</span>
                                <span class="message">Console ready - JavaScript output will appear here</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/simple-editor.js"></script>
</body>
</html>
