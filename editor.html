<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Interactive Code Editor</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/editor.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>
<body>
    <div class="editor-container">
        <header class="editor-header" style="background: #2d3748; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
            <div class="editor-title">
                <h1 style="margin: 0; font-size: 1.5rem;">CodeQuest Code Editor</h1>
            </div>
            <div class="editor-controls" style="display: flex; gap: 10px;">
                <button id="run-code" class="btn" style="background: #48bb78; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">▶ Run Code</button>
                <button id="save-code" class="btn" style="background: #667eea; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">💾 Save</button>
                <button id="reset-code" class="btn" style="background: #e53e3e; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">🔄 Reset</button>
                <a href="index.html" class="btn" style="background: #4a5568; color: white; padding: 8px 16px; border: none; border-radius: 4px; text-decoration: none;">← Dashboard</a>
            </div>
        </header>

        <div class="split-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 80px); padding: 20px;">
            <div class="editor-pane" style="background: white; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;">
                <div class="pane-header" style="background: #4a5568; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0;">Code Editor</h3>
                    <div class="editor-tabs" style="display: flex; gap: 5px;">
                        <button class="tab active" data-lang="html" style="background: #667eea; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">HTML</button>
                        <button class="tab" data-lang="css" style="background: #4a5568; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">CSS</button>
                        <button class="tab" data-lang="js" style="background: #4a5568; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">JavaScript</button>
                    </div>
                </div>
                <div class="editor-content" style="flex: 1; position: relative;">
                    <div class="editor-wrapper active" data-lang="html" style="height: 100%; display: flex;">
                        <textarea id="html-editor" class="code-editor" spellcheck="false" style="width: 100%; height: 100%; border: none; font-family: 'Courier New', monospace; font-size: 14px; padding: 15px; resize: none; outline: none;"><!DOCTYPE html>
<html>
<head>
    <title>My Project</title>
</head>
<body>
    <h1>Hello CodeQuest!</h1>
    <p>Start coding here...</p>
</body>
</html></textarea>
                    </div>
                    <div class="editor-wrapper" data-lang="css" style="height: 100%; display: none;">
                        <textarea id="css-editor" class="code-editor" spellcheck="false" style="width: 100%; height: 100%; border: none; font-family: 'Courier New', monospace; font-size: 14px; padding: 15px; resize: none; outline: none;">body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f0f0f0;
}

h1 {
    color: #333;
    text-align: center;
}</textarea>
                    </div>
                    <div class="editor-wrapper" data-lang="js" style="height: 100%; display: none;">
                        <textarea id="js-editor" class="code-editor" spellcheck="false" style="width: 100%; height: 100%; border: none; font-family: 'Courier New', monospace; font-size: 14px; padding: 15px; resize: none; outline: none;">console.log('Welcome to CodeQuest!');

// Your JavaScript code here</textarea>
                    </div>
                </div>
            </div>

            <div class="preview-pane" style="background: white; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;">
                <div class="pane-header" style="background: #4a5568; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0;">Live Preview</h3>
                    <button id="refresh-preview" class="refresh-btn" style="background: #667eea; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">🔄 Refresh</button>
                </div>
                <div class="preview-content" style="flex: 1; display: flex; flex-direction: column;">
                    <iframe id="preview-frame" sandbox="allow-scripts" style="flex: 1; border: none; background: white;"></iframe>
                    <div class="console-section" style="height: 150px; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column;">
                        <div class="console-header" style="background: #f7fafc; padding: 10px 15px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; font-weight: 600;">
                            <span>Console</span>
                            <button id="clear-console" class="console-btn" style="padding: 5px 10px; font-size: 0.8rem; background: #e2e8f0; color: #4a5568; border: none; border-radius: 4px; cursor: pointer;">Clear</button>
                        </div>
                        <div id="error-console" class="error-console" style="flex: 1; background: #1a202c; color: #e2e8f0; padding: 10px; font-family: 'Courier New', monospace; font-size: 0.9rem; overflow-y: auto;">
                            <div class="console-message info">
                                <span class="timestamp" style="color: #a0aec0; font-size: 0.8rem;">[Ready]</span>
                                <span class="message">Console ready - JavaScript output will appear here</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/simple-editor.js"></script>
</body>
</html>
